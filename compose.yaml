# Production: single container, SQLite database in a named volume.
#   docker compose up -d --build
# Optional settings go in a .env file next to this one (see .env.example).

name: mid-blog

services:
  app:
    build:
      context: .
      target: prod
    image: mid-blog:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4231}:4231"
    environment:
      DATABASE_PATH: /data/midblog.db
      # The app refuses to start with an empty key; a placeholder lets the site run,
      # only the AI generation endpoints will fail without a real key.
      OPENAI_KEY: "${OPENAI_KEY:-not-configured}"
    volumes:
      - app-data:/data

volumes:
  app-data:

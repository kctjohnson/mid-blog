# Development stack: live-reloading Go server + Parcel asset watcher.
#   docker compose -f compose.dev.yaml up --build
# Edit .templ / .go / assets on the host; air regenerates templ and restarts the server.

name: mid-blog-dev

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "4231:4231"
    environment:
      # Kept on a named volume, not the bind mount: SQLite locking is unreliable over macOS file sharing
      DATABASE_PATH: /data/midblog.db
      OPENAI_KEY: "${OPENAI_KEY:-not-configured}"
    volumes:
      - .:/src
      - dev-data:/data
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build

  assets:
    image: node:24-slim
    working_dir: /src
    command: sh -c "npm ci --no-audit --no-fund && npx parcel watch --no-hmr --cache-dir /tmp/parcel-cache"
    volumes:
      - .:/src
      # Keep Linux node_modules separate from the host's macOS ones
      - node-modules:/src/node_modules

volumes:
  dev-data:
  go-mod:
  go-build:
  node-modules:
